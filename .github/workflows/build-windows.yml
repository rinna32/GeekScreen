name: Build GeekScreen for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Compile screen capture
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 || exit /b 1
          call build.bat || exit /b 1

      - name: Verify PowerShell and package Windows release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path -LiteralPath 'screenshot.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors) { throw ($errors -join [Environment]::NewLine) }

          $files = 'start.bat', 'screenshot.ps1', 'capture.exe', 'README.md'
          foreach ($file in $files) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Missing release file: $file"
              }
          }
          Compress-Archive -LiteralPath $files -DestinationPath 'GeekScreen-windows-x64.zip'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Open the Windows ZIP artifact, extract GeekScreen-windows-x64.zip, and attach that ZIP to your GitHub Release.'

      - name: Upload the Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Windows ZIP
          path: GeekScreen-windows-x64.zip
          if-no-files-found: error
